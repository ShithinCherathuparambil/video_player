name: lumeo
description: A modern video player application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  video_player: ^2.8.2
  flutter_screenutil: ^5.9.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  video_thumbnail: ^0.5.3
  chewie: ^1.7.5
  path: ^1.8.3
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  cupertino_icons: ^1.0.2
  get_it: ^7.6.7
  intl: ^0.20.2
  device_info_plus: ^9.1.2
  photo_manager: ^3.7.1
  crypto: ^3.0.6
  local_auth: ^2.1.8
  file_picker: ^10.2.0
  
  # Universal video format support (VLC-like)
  better_player_plus: ^1.0.8
  flutter_vlc_player: ^7.0.0
  wakelock_plus: ^1.2.1
  
  # UI enhancements (MX Player-like)
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  lottie: ^3.1.0

dependency_overrides:
  shared_preferences_android: ^2.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  mockito: ^5.4.6
  bloc_test: ^9.1.7
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  # Assets configuration
  assets:
    # Images folder
    - assets/images/
    # Icons folder
    - assets/icons/
    # Other asset folders
    - assets/data/
    - assets/config/
